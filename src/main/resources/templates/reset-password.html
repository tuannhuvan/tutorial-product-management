<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: header('Đặt lại mật khẩu')}"></head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{fragments :: navbar}"></nav>
<div th:replace="~{fragments :: alerts}"></div>

<div class="container my-auto py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5 col-xl-4">
            <div class="portal-card p-4 p-sm-5">
                <div class="text-center mb-4">
                    <div class="d-inline-flex p-3 rounded-circle bg-success-subtle text-success mb-3">
                        <i class="bi bi-shield-lock-fill fs-2"></i>
                    </div>
                    <h3 class="fw-bold text-dark mb-1">Đặt lại Mật khẩu</h3>
                    <p class="text-muted small">Nhập mật khẩu mới thỏa mãn chính sách bảo mật</p>
                </div>

                <form th:action="@{/reset-password}" method="post">
                    <input type="hidden" name="token" th:value="${token}">

                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-secondary">Mật khẩu mới (Tối thiểu 12 ký tự)</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-key"></i></span>
                            <input type="password" name="newPassword" class="form-control bg-light border-start-0" placeholder="••••••••••••" required autofocus>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label small fw-semibold text-secondary">Xác nhận lại mật khẩu</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-check-circle"></i></span>
                            <input type="password" name="confirmPassword" class="form-control bg-light border-start-0" placeholder="Nhập lại mật khẩu" required>
                        </div>
                    </div>

                    <div class="p-3 bg-light rounded-3 mb-4 small text-muted">
                        <div class="fw-semibold text-dark mb-1"><i class="bi bi-info-circle text-primary"></i> Lưu ý:</div>
                        <p class="mb-0">Sau khi đổi mật khẩu thành công, tất cả các phiên đăng nhập khác của bạn sẽ bị hủy tự động để đảm bảo an toàn.</p>
                    </div>

                    <button type="submit" class="btn btn-gradient w-100 py-2 rounded-3 mb-3">
                        <i class="bi bi-check2-circle me-1"></i> Lưu mật khẩu mới
                    </button>
                </form>

                <div class="text-center pt-3 border-top">
                    <a th:href="@{/login}" class="small text-decoration-none text-muted">
                        <i class="bi bi-arrow-left"></i> Quay lại Đăng nhập
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
