<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: header('Quên mật khẩu')}"></head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{fragments :: navbar}"></nav>
<div th:replace="~{fragments :: alerts}"></div>

<div class="container my-auto py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5 col-xl-4">
            <div class="portal-card p-4 p-sm-5">
                <div class="text-center mb-4">
                    <div class="d-inline-flex p-3 rounded-circle bg-warning-subtle text-warning-emphasis mb-3">
                        <i class="bi bi-key-fill fs-2"></i>
                    </div>
                    <h3 class="fw-bold text-dark mb-1">Khôi phục Mật khẩu</h3>
                    <p class="text-muted small">Nhập email của bạn để nhận liên kết đặt lại mật khẩu an toàn</p>
                </div>

                <form th:action="@{/forgot-password}" method="post">
                    <div class="mb-4">
                        <label class="form-label small fw-semibold text-secondary">Địa chỉ Email đăng ký</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
                            <input type="email" name="email" class="form-control bg-light border-start-0" placeholder="email@fptaptech.edu.vn" required autofocus>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-gradient w-100 py-2 rounded-3 mb-3">
                        <i class="bi bi-send me-1"></i> Gửi liên kết khôi phục
                    </button>
                </form>

                <div class="text-center pt-3 border-top">
                    <a th:href="@{/login}" class="small text-decoration-none text-muted">
                        <i class="bi bi-arrow-left"></i> Quay lại trang Đăng nhập
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
