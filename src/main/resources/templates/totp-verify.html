<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: header('Xác thực 2 bước (2FA)')}"></head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{fragments :: navbar}"></nav>
<div th:replace="~{fragments :: alerts}"></div>

<div class="container my-auto py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5 col-xl-4">
            <div class="portal-card p-4 p-sm-5">
                <div class="text-center mb-4">
                    <div class="d-inline-flex p-3 rounded-circle bg-primary-subtle text-primary mb-3">
                        <i class="bi bi-shield-lock-fill fs-2"></i>
                    </div>
                    <h3 class="fw-bold text-dark mb-1">Xác thực 2 bước</h3>
                    <p class="text-muted small">Nhập mã OTP từ ứng dụng hoặc Mã khôi phục 8 ký tự</p>
                </div>

                <form th:action="@{/totp/verify}" method="post">
                    <div class="mb-4">
                        <label class="form-label small fw-semibold text-secondary">Mã bảo mật (OTP / Recovery Code)</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-key-fill"></i></span>
                            <input type="text" name="code" class="form-control bg-light border-start-0 text-center fw-bold fs-4 font-monospace" placeholder="Mã 6 số hoặc mã khôi phục" required autofocus>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-gradient w-100 py-2 rounded-3 mb-3">
                        <i class="bi bi-check-lg me-1"></i> Xác nhận & Tiếp tục
                    </button>
                </form>

                <div class="text-center pt-3 border-top">
                    <form th:action="@{/logout}" method="post" class="m-0">
                        <button type="submit" class="btn btn-link btn-sm text-decoration-none text-muted">
                            <i class="bi bi-box-arrow-left"></i> Đăng xuất tài khoản
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
