<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="header(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' - FPT Aptech Student Portal'">FPT Aptech Student Portal</title>
    <!-- Google Fonts & Bootstrap 5 & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --secondary: #0ea5e9;
            --dark-bg: #0f172a;
            --card-bg: rgba(255, 255, 255, 0.95);
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #312e81 100%);
            min-height: 100vh;
            color: #1e293b;
        }
        .navbar-custom {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .portal-card {
            background: var(--card-bg);
            border-radius: 1.25rem;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
        }
        .badge-status-ACTIVE { background-color: #10b981; color: white; }
        .badge-status-PENDING { background-color: #f59e0b; color: white; }
        .badge-status-LOCKED { background-color: #ef4444; color: white; }
        .badge-status-DISABLED { background-color: #64748b; color: white; }
        .badge-status-INVITED { background-color: #8b5cf6; color: white; }
        .btn-gradient {
            background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
            color: #ffffff;
            border: none;
            font-weight: 600;
            transition: all 0.2s ease-in-out;
        }
        .btn-gradient:hover {
            background: linear-gradient(135deg, #4338ca 0%, #4f46e5 100%);
            color: #ffffff;
            transform: translateY(-1px);
            box-shadow: 0 8px 20px -6px rgba(79, 70, 229, 0.6);
        }
    </style>
</head>
<body>

<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top py-3">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center fw-bold fs-4" th:href="@{/}">
            <span class="badge bg-primary p-2 me-2 rounded-3"><i class="bi bi-shield-lock-fill"></i></span>
            <span>FPT Aptech <span class="text-info">Portal</span></span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navContent">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0" sec:authorize="isAuthenticated()">
                <li class="nav-item">
                    <a class="nav-link text-white-50" th:href="@{/}"><i class="bi bi-house-door me-1"></i> Trang chủ</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white-50" th:href="@{/me/sessions}"><i class="bi bi-laptop me-1"></i> Quản lý phiên</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link text-white-50" th:href="@{/admin/users}"><i class="bi bi-people me-1"></i> Quản trị tài khoản</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link text-white-50" th:href="@{/admin/audit-logs}"><i class="bi bi-journal-text me-1"></i> Nhật ký kiểm toán</a>
                </li>
            </ul>

            <div class="d-flex align-items-center ms-auto">
                <div sec:authorize="isAuthenticated()" class="d-flex align-items-center gap-3">
                    <div class="text-end text-white d-none d-md-block">
                        <div class="fw-bold small" sec:authentication="name">Username</div>
                        <span class="badge bg-secondary-subtle text-secondary small" sec:authentication="principal.authorities">ROLE</span>
                    </div>
                    <form th:action="@{/logout}" method="post" class="m-0">
                        <button type="submit" class="btn btn-outline-light btn-sm px-3 rounded-pill">
                            <i class="bi bi-box-arrow-right me-1"></i> Đăng xuất
                        </button>
                    </form>
                </div>

                <div sec:authorize="!isAuthenticated()" class="d-flex gap-2">
                    <a th:href="@{/login}" class="btn btn-outline-light btn-sm px-3 rounded-pill">Đăng nhập</a>
                    <a th:href="@{/registration}" class="btn btn-primary btn-sm px-3 rounded-pill">Đăng ký</a>
                </div>
            </div>
        </div>
    </div>
</nav>

<div th:fragment="alerts" class="container mt-3">
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show rounded-3 shadow-sm border-0" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${errorMessage}">Lỗi xử lý</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show rounded-3 shadow-sm border-0" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${successMessage}">Thành công</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${infoMessage}" class="alert alert-info alert-dismissible fade show rounded-3 shadow-sm border-0" role="alert">
        <i class="bi bi-info-circle-fill me-2"></i>
        <span th:text="${infoMessage}">Thông tin</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
</div>

<footer th:fragment="footer" class="text-center text-white-50 py-4 mt-auto">
    <div class="container small">
        <p class="mb-1">&copy; 2026 FPT Aptech - Hệ thống Cổng tài khoản học viên (Student Account Portal)</p>
        <p class="mb-0 text-white-50">Bảo mật theo tiêu chuẩn Spring Security 7.1 & TOTP RFC 6238</p>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</footer>

</body>
</html>
