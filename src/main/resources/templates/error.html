<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: header('Thông báo lỗi')}"></head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{fragments :: navbar}"></nav>

<div class="container my-auto py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="portal-card p-5">
                <div class="d-inline-flex p-3 rounded-circle bg-danger-subtle text-danger mb-3">
                    <i class="bi bi-exclamation-triangle-fill fs-1"></i>
                </div>
                <h3 class="fw-bold text-dark mb-2">Đã xảy ra lỗi</h3>
                <p class="text-muted small mb-4" th:text="${message != null ? message : 'Yêu cầu không thể hoàn tất hoặc phiên làm việc đã hết hạn. Vui lòng thử lại.'}">
                    Yêu cầu không thể hoàn tất hoặc phiên làm việc đã hết hạn.
                </p>

                <div class="d-grid gap-2">
                    <a th:href="@{/}" class="btn btn-primary rounded-pill py-2">
                        <i class="bi bi-house-door me-1"></i> Về trang chủ
                    </a>
                    <a th:href="@{/login}" class="btn btn-outline-secondary rounded-pill py-2">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Đến trang đăng nhập
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
